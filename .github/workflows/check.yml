name: ANIX PRO Quick Check
# Fast, diagnostic-only gate: analyzer and test failures are published as ::error annotations on
# the commit, so the exact file:line:column:message is readable from the API in environments where
# Actions log blobs are not reachable. Never blocks a pull request (always exits 0).
on:
  push:
    branches: ['work/**', 'arena/**']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      # Offline gate that needs no SDK: import/export targets, duplicate declarations between a
      # library and its imports, unbalanced delimiters, shared design tokens. Runs first so a
      # broken path is reported in seconds with an exact file name instead of a cascade.
      - name: Static checks (no SDK)
        run: python3 tool/verify_static.py
      - name: Analyze
        run: |
          # Errors fail the gate; infos/warnings stay advisory (they are annotated below).
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "=====ANALYZE-ISSUES====="
          grep -E " • " analyze.txt | grep -vE "^Analyzing" | head -120
          echo "=====ANALYZE-END====="
          # One annotation per issue keeps the message inside GitHub's 64 KB step limit.
          grep -E " • " analyze.txt | grep -vE "^Analyzing" | head -60 | while IFS= read -r line; do
            echo "::error title=analyze::$line"
          done
          # Analyzer *errors* are not advisory: they mean the app cannot compile, so the quick
          # check fails on them (infos / warnings stay non-blocking).
          if grep -qE "^\s*error\s+•" analyze.txt; then
            echo "::error title=analyze::flutter analyze reported errors"
            exit 1
          fi
          exit 0
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          echo "=====TEST-SUMMARY====="
          grep -E "All tests passed|Some tests failed|\[E\]" test.txt | head -40
          echo "=====TEST-END====="
          grep -E "\[E\]|Expected:|Actual:" test.txt | head -40 | while IFS= read -r line; do
            echo "::error title=test::$line"
          done
          exit 0
      - name: Finger soccer v12 tests
        run: |
          set +e
          flutter test test/games/finger_soccer_v12_test.dart --reporter expanded > v12.txt 2>&1
          tail -40 v12.txt
          # Own step = own annotation budget (GitHub keeps 10 per type per step).
          grep -E "\[E\]|Expected:|Actual:|Which:|All tests passed|Some tests failed" v12.txt | head -10 | while IFS= read -r line; do
            echo "::warning title=fs-v12::$line"
          done
          exit 0
      - name: Render finger soccer preview
        run: |
          set +e
          mkdir -p shots
          sudo mkdir -p /workspace/work && sudo ln -sfn $FLUTTER_ROOT /workspace/work/flutter_sdk && sudo ln -sfn $PWD /workspace/work/anix
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1
          flutter test test_render/finger_soccer_render_test.dart --dart-define=SHOTS=$PWD/shots > render.txt 2>&1
          tail -20 render.txt
          grep -E "All tests passed|Some tests failed|EXCEPTION|overflowed|Expected:|Actual:" render.txt | head -10 | while IFS= read -r line; do
            echo "::notice title=fs-render::$line"
          done
          flutter test test_render/finger_soccer_intro_render_test.dart --dart-define=SHOTS=$PWD/shots > intro.txt 2>&1
          echo "=====INTRO-BEGIN====="
          grep -E "Error|error:|Expected:|Actual:|FAILED|failed|passed|EXCEPTION|overflowed" intro.txt | head -120
          tail -15 intro.txt
          echo "=====INTRO-END====="
          ls -la shots
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: render-shots
          path: shots
          if-no-files-found: ignore

  # Solo arcade art pass: renders every solo board to docs/solo_shots (uploaded as an artifact)
  # and fails the job only on a thrown exception, so the screenshots are always available for
  # review even when a board needs a tweak.
  solo-art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Widget tests (solo art + rules)
        run: |
          set +e
          flutter test test/games/solo --reporter expanded > solo-test.txt 2>&1
          status=$?
          grep -E "All tests passed|Some tests failed|\[E\]|Expected:|Actual:|Which:" solo-test.txt | head -40
          grep -E "\[E\]|Expected:|Actual:" solo-test.txt | head -20 | while IFS= read -r line; do
            echo "::error title=solo-test::$line"
          done
          exit "$status"
      - name: Render every solo board
        run: |
          set +e
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1
          flutter test test_render/solo_render_test.dart \
            --dart-define=SHOTS=$PWD/shots/solo > solo-render.txt 2>&1
          grep -E "All tests passed|Some tests failed|EXCEPTION|overflowed|RenderFlex|Expected:|Actual:" solo-render.txt | head -30
          ls -R shots/solo 2>/dev/null | head -60
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: solo-art-shots
          path: shots/solo
          if-no-files-found: warn
      # Half-resolution copies committed to docs/solo_shots so the art is reviewable straight in
      # the repository (artifacts expire and are not reachable from every environment).
      - name: Publish screenshots to docs/solo_shots
        run: |
          set +e
          flutter test test_render/solo_render_test.dart \
            --dart-define=SHOTS=$PWD/docs/solo_shots --dart-define=DPR=1 \
            --dart-define=W=270 --dart-define=H=585 --dart-define=SECS=3 > solo-docs.txt 2>&1
          tail -5 solo-docs.txt
          find docs/solo_shots -name '*.png' | wc -l
          du -sh docs/solo_shots 2>/dev/null
          exit 0
      - name: Commit screenshots (only when they changed)
        run: |
          set +e
          git config user.name  "ANIX art bot"
          git config user.email "art-bot@users.noreply.github.com"
          git add docs/solo_shots
          if git diff --cached --quiet; then echo "no screenshot changes"; exit 0; fi
          git commit -m "solo art: refresh board previews [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          exit 0
