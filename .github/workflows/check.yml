name: ANIX Quick Check
on:
  push:
    branches: ['work/**']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "=====ANALYZE-BEGIN====="
          grep -E "(error|warning) •" analyze.txt
          echo "=====ANALYZE-END====="
          exit 0
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          echo "=====TEST-BEGIN====="
          grep -E "\[E\]|Error:|error:|Expected:|Actual:|FAILED|Some tests failed|All tests passed|Failed to load" test.txt | head -300
          echo "=====TEST-END====="
          exit 0
      - name: Render finger soccer preview
        run: |
          set +e
          mkdir -p shots
          sudo mkdir -p /workspace/work && sudo ln -sfn $FLUTTER_ROOT /workspace/work/flutter_sdk && sudo ln -sfn $PWD /workspace/work/anix
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1
          flutter test test_render/finger_soccer_render_test.dart --dart-define=SHOTS=$PWD/shots > render.txt 2>&1
          tail -20 render.txt
          flutter test test_render/finger_soccer_intro_render_test.dart --dart-define=SHOTS=$PWD/shots > intro.txt 2>&1
          echo "=====INTRO-BEGIN====="
          grep -E "Error|error:|Expected:|Actual:|FAILED|failed|passed|EXCEPTION|overflowed" intro.txt | head -120
          tail -15 intro.txt
          echo "=====INTRO-END====="
          ls -la shots
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: render-shots
          path: shots
          if-no-files-found: ignore
