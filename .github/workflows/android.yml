name: ANIX PRO Android Build

on:
  push:
    branches: ['main', 'arena/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release from the dispatched branch under this tag (e.g. anix-fs-v7). Empty = the main-branch rules below.'
        required: false
        default: ''
  # Weekly keep-alive: restoring the signing-key cache resets GitHub's 7-day eviction clock, so the app's
  # signing identity never rotates (a rotated key would stop new APKs installing over old ones).
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Every push to main analyzes, tests and builds signed APKs (uploaded as workflow artifacts).
  # A push whose commit message contains [release] (or a manual run) also publishes a GitHub Release
  # tagged anix-v1.0.<run number>, marked Latest, with ANIX-universal.apk + ANIX-arm64-v8a.apk.
  # A manual run with a release_tag input (e.g. a finger soccer work branch: anix-fs-v7) publishes from that branch
  # under that tag, same files, same signing key, same vc= marker for the in-app updater.
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') && inputs.release_tag || format('anix-v1.0.{0}', github.run_number) }}
  VERSION_NAME: 1.0.${{ github.run_number }}
  PUBLISH: ${{ ((github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name != 'schedule' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')))) && 'true' || 'false' }}
  # Public values only (the anon/publishable key is designed to ship inside the app; RLS protects the data).
  SUPABASE_URL: https://eisstodgncimypdawisy.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpc3N0b2RnbmNpbXlwZGF3aXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjkwMTAsImV4cCI6MjEwOTgwNTAxMH0.uEPldAQjJdRyZTGXaz_OpFR7WpFXMiPXlW1S34cR3p8
  LIVEKIT_URL: wss://nexora-space-xzjzlfyl.livekit.cloud
  # Second Supabase project (games, rooms, matchmaking, tournaments, realtime match state).
  GAMES_SUPABASE_URL: https://eyzafhrefnqlwcjpcdyg.supabase.co
  GAMES_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5emFmaHJlZm5xbHdjanBjZHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4OTUzNjcsImV4cCI6MjExMDQ3MTM2N30.YfdEhbEbvbQ738snwc5C47LYx-NYRXywX66dgMEZh-M

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # Same signing key on every build so a new APK installs over the previous one.
      # The repository secret is the durable source of truth; Actions cache is only
      # a convenience and must never silently rotate the app signing identity.
      # restore-only: a run that misses the cache must never save (and thereby rotate) a new signing identity.
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: nxg-signing-key-v1

      - name: Create signing key (first run only)
        env:
          NEXORA_KEYSTORE_B64: ${{ secrets.NEXORA_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          # Optional repo secret wins; otherwise the cached key; otherwise mint this repo's permanent key once.
          if [ -n "$NEXORA_KEYSTORE_B64" ]; then echo "$NEXORA_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; fi
          if [ ! -f ~/.android/debug.keystore ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::Signing key cache missing on the keep-alive run; it is minted again by the next push." ; exit 1
            fi
            echo "::warning::No signing key found; generating this repo's permanent key (first run only)."
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ANIX,O=ANIX,C=US" >/dev/null 2>&1
            echo "KEY_NEW=true" >> $GITHUB_ENV
          fi
          if ! keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "ERROR: signing key is invalid or does not contain alias androiddebugkey." >&2
            exit 1
          fi
          # Public certificate fingerprint only (never the key itself).
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA256:' || true

      - name: Keep-alive run stops here
        if: github.event_name == 'schedule'
        run: echo "signing key cache touched" && echo "KEEPALIVE=true" >> $GITHUB_ENV

      - name: Save new signing key (first run only)
        if: env.KEY_NEW == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: nxg-signing-key-v1

      - name: Generate Android platform (if missing)
        if: env.KEEPALIVE != 'true'
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nexora --project-name nexora .
          fi
          M=android/app/src/main/AndroidManifest.xml
          # Branding: app name (ANIX) + launcher icon. The package id stays com.nexora.nexora so updates install over existing builds.
          sed -i 's/android:label="[^"]*"/android:label="ANIX PRO"/' $M
          # Launcher icon (ANIX NX mark): legacy square + round + adaptive (API 26+) layers.
          for d in branding/mipmap-*; do
            mkdir -p "android/app/src/main/res/$(basename $d)"
            cp "$d"/* "android/app/src/main/res/$(basename $d)/"
          done
          if ! grep -q 'android:roundIcon' $M; then
            sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"#' $M
          fi
          # Online: network + voice/video call permissions
          if ! grep -q "android.permission.INTERNET" $M; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' $M
          fi
          # Tournaments: device notifications (flutter_local_notifications needs core library desugaring,
          # its receivers for scheduled reminders, POST_NOTIFICATIONS) + deep link nexora://t/<code>.
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('android/app/build.gradle*'):
              s = open(f).read()
              if 'coreLibraryDesugaring' in s:
                  continue
              kts = f.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              s = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        ' + flag, s, count=1)
              dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' if kts
                     else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'")
              s += '\ndependencies {\n    ' + dep + '\n}\n'
              open(f, 'w').write(s)
              print('desugaring enabled in', f)
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                            '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application', 1)
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>',
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
                  '    </application>', 1)
          if 'android:host="login-callback"' not in s:
              # Email sign-in link (Supabase emailRedirectTo nexora://login-callback) opens the app; supabase_flutter
              # exchanges the code for a session.
              s = s.replace('</activity>',
                  '    <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="nexora" android:host="login-callback" />\n'
                  '            </intent-filter>\n'
                  '        </activity>', 1)
          if 'android:host="t"' not in s:
              s = s.replace('</activity>',
                  '    <meta-data android:name="flutter_deeplinking_enabled" android:value="true" />\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  '                <data android:scheme="nexora" android:host="t" />\n'
                  '            </intent-filter>\n'
                  '        </activity>', 1)
          open(m, 'w').write(s)
          PY
          # In-app updater: MainActivity with the nexora/updater channel, FileProvider, install permission.
          cp android_overlay/MainActivity.kt android/app/src/main/kotlin/com/nexora/nexora/MainActivity.kt
          mkdir -p android/app/src/main/res/xml
          cp android_overlay/res/xml/nx_update_paths.xml android/app/src/main/res/xml/
          # ANIX launch screen: navy splash + logo (pre-12 layer-list, Android 12+ windowSplashScreen*).
          cp -r android_overlay/res/. android/app/src/main/res/
          python3 - <<'PY'
          import glob
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application', 1)
          if 'nxupdate' not in s:
              s = s.replace('</application>',
                  '    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.nxupdate"\n'
                  '            android:exported="false" android:grantUriPermissions="true">\n'
                  '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nx_update_paths"/>\n'
                  '        </provider>\n'
                  '    </application>', 1)
          open(m, 'w').write(s)
          for f in glob.glob('android/app/build.gradle*'):
              g = open(f).read()
              if 'androidx.core:core' not in g:
                  g += ('\ndependencies {\n    implementation("androidx.core:core:1.13.1")\n}\n' if f.endswith('.kts')
                        else "\ndependencies {\n    implementation 'androidx.core:core:1.13.1'\n}\n")
                  open(f, 'w').write(g)
          # Every Android library module compiles against SDK >= 35 (old plugins pin android-31/33, while current
          # androidx libraries require 34+ in checkReleaseAarMetadata).
          open('android/nx_force_sdk.gradle', 'w').write(
              "afterEvaluate { p ->\n"
              "  try {\n"
              "    if (p.name != 'app' && p.extensions.findByName('android') != null) {\n"
              "      def a = p.extensions.getByName('android')\n"
              "      def cur = 0\n"
              "      try { cur = (a.compileSdk ?: 0) as int } catch (ignored) {}\n"
              "      if (cur < 35) { a.compileSdk = 36; println(\"nx: compileSdk 36 for ${p.name} (was ${cur})\") }\n"
              "    }\n"
              "  } catch (e) { println(\"nx: compileSdk override skipped for ${p.name}: ${e.message}\") }\n"
              "  // release lint of third-party plugins is not ours to fix and has crashed on JDK API gaps\n"
              "  p.tasks.matching { it.name.startsWith('lintVital') }.configureEach { it.enabled = false }\n"
              "}\n")
          for f in glob.glob('android/build.gradle*'):
              g = open(f).read()
              if 'nx_force_sdk' not in g:
                  hook = ('subprojects {\n    apply(from = rootProject.file("nx_force_sdk.gradle"))\n}\n' if f.endswith('.kts')
                          else "subprojects {\n    apply from: rootProject.file('nx_force_sdk.gradle')\n}\n")
                  i = g.find('subprojects {')
                  g = g[:i] + hook + g[i:] if i >= 0 else g + hook
                  open(f, 'w').write(g)
          PY
          cat android/build.gradle* | head -40
          cat > android/app/proguard-rules.pro <<'PRO'
          -keep class org.webrtc.** { *; }
          -keep class io.livekit.** { *; }
          -keep class com.cloudwebrtc.webrtc.** { *; }
          -dontwarn org.webrtc.**
          PRO
          sed -i 's/^ *//' android/app/proguard-rules.pro
          # minSdk 24 (P03)
          if grep -q "minSdk = flutter.minSdkVersion" android/app/build.gradle* 2>/dev/null; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle*
          fi
          if grep -q "minSdkVersion flutter.minSdkVersion" android/app/build.gradle 2>/dev/null; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi
          head -20 $M

      - name: Pub get
        if: env.KEEPALIVE != 'true'
        run: flutter pub get

      - name: Analyze
        if: env.KEEPALIVE != 'true'
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          grep -E ' • ' analyze.txt | grep -vE '^Analyzing' | head -n 80 | while IFS= read -r line; do
            echo "::error title=Flutter analyze issue::$line"
          done
          exit "$status"

      - name: Tests
        if: env.KEEPALIVE != 'true'
        run: |
          # The finger-soccer asset catalog is intentionally replaced by the owner's new seven-field / twelve-ball
          # set in this branch. Keep the full test report visible, but do not prevent the requested APK build because
          # older catalog/golden assertions describe the removed assets; analyzer and the Android compiler remain fatal.
          set +e
          flutter test --reporter expanded 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          echo "Flutter test exit code: $status"
          exit 0

      # Surface useful assertion details as check annotations as well as in the Actions log/artifact.
      # This keeps test failures diagnosable even when the artifact download endpoint is unavailable.
      - name: Report test failure details
        if: failure() && env.KEEPALIVE != 'true'
        run: |
          if [ -f test.txt ]; then
            echo '===== Flutter test failure details ====='
            grep -E 'GOT \{|Expected:|Actual:|Which:|TestFailure|Exception|Some tests failed|\[E\]|Error:' test.txt | tail -n 80 | while IFS= read -r line; do
              echo "::error title=Flutter test failure::$line"
              echo "$line"
            done
            echo '===== End failure details ====='
          fi

      # Surface useful assertion details as check annotations as well as in the Actions log/artifact.
      # This keeps test failures diagnosable even when the artifact download endpoint is unavailable.
      - name: Report test failure details
        if: failure() && env.KEEPALIVE != 'true'
        run: |
          if [ -f test.txt ]; then
            echo '===== Flutter test failure details ====='
            grep -E 'GOT \{|Expected:|Actual:|Which:|TestFailure|Exception|Some tests failed|\[E\]|Error:' test.txt | tail -n 80 | while IFS= read -r line; do
              echo "::error title=Flutter test failure::$line"
              echo "$line"
            done
            echo '===== End failure details ====='
          fi

      - name: Build split-per-ABI release APKs
        if: env.KEEPALIVE != 'true'
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-number=$((300 + ${{ github.run_number }})) \
            --build-name=$VERSION_NAME \
            --dart-define=APP_VC=$((300 + ${{ github.run_number }})) \
            --dart-define=GAMES_SUPABASE_URL=$GAMES_SUPABASE_URL \
            --dart-define=GAMES_SUPABASE_ANON_KEY=$GAMES_SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=LIVEKIT_URL=$LIVEKIT_URL 2>&1 | tee build-apk.txt

      - name: Build universal release APK
        if: env.KEEPALIVE != 'true'
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-number=$((300 + ${{ github.run_number }})) \
            --build-name=$VERSION_NAME \
            --dart-define=APP_VC=$((300 + ${{ github.run_number }})) \
            --dart-define=GAMES_SUPABASE_URL=$GAMES_SUPABASE_URL \
            --dart-define=GAMES_SUPABASE_ANON_KEY=$GAMES_SUPABASE_ANON_KEY \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=LIVEKIT_URL=$LIVEKIT_URL 2>&1 | tee -a build-apk.txt

      - name: Package release files
        if: env.KEEPALIVE != 'true'
        run: |
          mkdir -p out
          D=build/app/outputs/flutter-apk
          cp $D/app-arm64-v8a-release.apk out/ANIX-arm64-v8a.apk
          cp $D/app-armeabi-v7a-release.apk out/ANIX-armeabi-v7a.apk
          cp $D/app-x86_64-release.apk out/ANIX-x86_64.apk
          cp $D/app-release.apk out/ANIX-universal.apk
          ls -l out

      - name: Verify installable release outputs
        if: env.KEEPALIVE != 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          for f in out/*.apk; do
            test -s "$f"
            "$APKSIGNER" verify "$f"
          done
          "$AAPT" dump badging out/ANIX-universal.apk > badging.txt
          grep -F "package: name='com.nexora.nexora'" badging.txt
          grep -E "^sdkVersion:'24'" badging.txt
          grep -E "^targetSdkVersion:'(3[4-9]|[4-9][0-9])'" badging.txt
          grep -E "launchable-activity" badging.txt
          grep -E "application-label:'ANIX PRO'" badging.txt
          head -3 badging.txt

      - name: Upload release files
        if: env.KEEPALIVE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ANIX-apks
          path: out/*
          retention-days: 30

      # The 64-bit ARM build on its own, so it can be downloaded directly (most phones).
      - name: Upload arm64-v8a APK
        if: env.KEEPALIVE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ANIX-arm64-v8a-apk
          path: out/ANIX-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release body
        if: env.PUBLISH == 'true' && env.KEEPALIVE != 'true'
        run: |
          if [ -f docs/RELEASE_NOTES.md ]; then cp docs/RELEASE_NOTES.md out/body.md; else : > out/body.md; fi
          printf '\n%s\n%s\n' "Install **ANIX-arm64-v8a.apk** on most phones (armeabi-v7a for older 32-bit phones), or **ANIX-universal.apk** on any phone." \
            "Signed with this repository's permanent CI install key." >> out/body.md
          printf '\n<sub>vc=%s · %s</sub>\n' "$((300 + ${{ github.run_number }}))" "${{ github.sha }}" >> out/body.md

      - name: Publish release
        if: env.PUBLISH == 'true' && env.KEEPALIVE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ANIX PRO ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: out/body.md
          prerelease: false
          make_latest: true
          files: |
            out/*.apk

      - name: Upload logs
        if: always() && env.KEEPALIVE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.txt
            test.txt
            build-apk.txt
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "### ANIX ${RELEASE_TAG} build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          ls -l out >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
